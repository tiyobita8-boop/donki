<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>レトロ液晶 ドンキーコング風</title><style>
*{box-sizing:border-box}body{margin:0;background:#25282d;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:14px;touch-action:manipulation}.shell{width:min(100%,510px);background:linear-gradient(130deg,#f8a13d,#df641f);border:7px solid #a84819;border-radius:20px;box-shadow:0 16px 35px #0008;padding:15px}.brand{text-align:center;font-weight:900;letter-spacing:3px;color:#652c13;font-size:19px}.screen{position:relative;background:#a9b9a0;border:9px solid #713b1c;border-radius:9px;margin:10px auto;box-shadow:inset 0 0 12px #415448;overflow:hidden}.screen canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.hinge{height:19px;background:linear-gradient(#c45c24,#ffb85a,#b95221);border-radius:7px;margin:-3px 20px}.status{display:flex;justify-content:space-between;color:#52270f;font-weight:bold;font-size:14px;margin:7px 2px}.controls{display:flex;justify-content:space-between;align-items:center;margin:10px 12px}.dpad{display:grid;grid-template-columns:repeat(3,49px);grid-template-rows:repeat(3,44px)}button{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}.dpad button,.jump{border:2px solid #222;background:#3c3b3d;color:white;font-size:22px;font-weight:bold;box-shadow:0 4px 0 #161616}.dpad button:active,.jump:active{transform:translateY(3px);box-shadow:none}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.jump{width:100px;height:80px;border-radius:50%;background:#a62622;font-size:18px}.smallbuttons{display:flex;justify-content:center;gap:10px}.smallbuttons button{border:1px solid #7e3818;border-radius:20px;padding:8px 16px;background:#f8c084;color:#632c11;font-weight:bold}.help{font-size:12px;color:#542810;line-height:1.7;margin:12px 4px 0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#a9b9a0db;color:#27352a;font-weight:bold;line-height:2;white-space:pre-line}.hide{display:none}
</style></head><body><main class="shell"><div class="brand">GAME &amp; WATCH<br><small>DONKEY KONG · 1982 STYLE</small></div><div class="screen"><canvas id="top" width="360" height="220"></canvas><div id="overlay" class="overlay">GAME A / GAME B を押して開始<br>矢印で移動・JUMPでジャンプ</div></div><div class="hinge"></div><div class="screen"><canvas id="bottom" width="360" height="220"></canvas></div><div class="status"><span id="score">SCORE 000</span><span id="life">MISS 0/3</span><span id="wire">WIRE 4</span></div><div class="controls"><div class="dpad"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="right" data-key="right">▶</button><button class="down" data-key="down">▼</button></div><button class="jump" data-key="jump">JUMP</button></div><div class="smallbuttons"><button id="a">GAME A</button><button id="b">GAME B</button><button id="pause">PAUSE</button><button id="sound">🔊 ON</button></div><p class="help">🎮 1982年の2画面液晶ゲームをイメージしたアレンジ版。下画面を右→はしご→左→はしごと進み、上画面で左のスイッチを操作。右端からクレーンのフックが近づいた瞬間にジャンプ！ 4本のワイヤーを外すとクリア。キーボードは矢印キー＋スペース。</p></main><script>
const tc=document.getElementById('top'),bc=document.getElementById('bottom'),T=tc.getContext('2d'),B=bc.getContext('2d');let running=false,paused=false,mode=0,score=0,miss=0,wires=4,phase=0,x=28,jump=0,barrels=[],spawn=0,hook=0,hookOn=false,hookTime=0,last=0,flash=0,sound=true,level=1,invuln=0,beam=0;const ink='#304638',lite='#7b927b';function beep(f=480,d=.07){if(!sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);o.onended=()=>a.close()}catch(e){}}function line(c,x,y,w,h,col=ink){c.fillStyle=col;c.fillRect(x,y,w,h)}function txt(c,s,x,y,size=12){c.fillStyle=ink;c.font=`bold ${size}px monospace`;c.fillText(s,x,y)}function person(c,px,py){c.save();c.translate(px,py-jump*27);line(c,-5,-23,11,4);line(c,-7,-19,15,5);line(c,-4,-14,10,7);line(c,-7,-7,15,9);line(c,-6,2,5,7);line(c,3,2,5,7);line(c,-10,-7,4,8);line(c,8,-7,4,8);c.restore()}function gorilla(c){line(c,246,63,56,42);line(c,255,49,37,21);line(c,251,76,12,28);line(c,291,76,13,28);line(c,263,74,22,19,lite);line(c,264,60,6,5,lite);line(c,280,60,6,5,lite);txt(c,'DK',265,90,13)}function ladder(c,xx,y1,y2){line(c,xx,y1,4,y2-y1);line(c,xx+22,y1,4,y2-y1);for(let y=y1+8;y<y2;y+=13)line(c,xx,y,26,3)}function girder(c,y,from=12,to=345){line(c,from,y,to-from,8);for(let xx=from+8;xx<to-8;xx+=24){line(c,xx,y+9,3,7)}}function barrel(c,xx,yy){c.strokeStyle=ink;c.lineWidth=3;c.beginPath();c.ellipse(xx,yy,9,10,0,0,Math.PI*2);c.stroke();line(c,xx-7,yy-2,14,4)}function base(c){c.fillStyle='#a9b9a0';c.fillRect(0,0,360,220);c.strokeStyle='#8d9e8b';for(let i=0;i<360;i+=20){c.beginPath();c.moveTo(i,0);c.lineTo(i,220);c.stroke()}for(let j=0;j<220;j+=20){c.beginPath();c.moveTo(0,j);c.lineTo(360,j);c.stroke()}}function render(){base(T);base(B);txt(T,'SCORE '+String(score).padStart(3,'0'),10,20,15);txt(T,'GAME '+(mode===2?'B':'A'),255,20);txt(T,'WIRE '+wires,10,39);girder(T,190);girder(T,110,215,350);ladder(T,28,115,190);gorilla(T);txt(T,'HELP!',309,57);line(T,244,108,90,5);for(let i=0;i<wires;i++)line(T,248+i*18,109,2,21);line(T,65,66,3,90);line(T,65,66,143,4);line(T,202,66,3,26);if(hookOn){let hx=190-110*Math.abs(Math.sin(hookTime*2.1));line(T,hx,67,2,39);T.strokeStyle=ink;T.lineWidth=4;T.beginPath();T.arc(hx+1,107,9,0,Math.PI);T.stroke()}else{txt(T,'CRANE OFF',82,58,10)}if(phase===3){if(!hookOn)txt(T,'LEFT: SWITCH',82,47,11);else if(x>=175&&Math.abs((190-110*Math.abs(Math.sin(hookTime*2.1)))-x)<40){txt(T,'★ JUMP! ★',110,45,18)}else txt(T,'HOOKを待ってね',91,45,12)}txt(T,'SWITCH',9,145,10);line(T,37,155,15,8);if(phase===2)person(T,x,187);if(phase===3)person(T,x,107);for(let b of barrels){if(b.p===2)barrel(T,b.x,178);if(b.p===3)barrel(T,b.x,98)}base(B);txt(B,'RETRO LCD',14,23,12);girder(B,185);girder(B,96);ladder(B,305,100,185);ladder(B,23,13,96);if(phase===0)person(B,x,182);if(phase===1)person(B,x,93);for(let b of barrels){if(b.p===0)barrel(B,b.x,174);if(b.p===1)barrel(B,b.x,85)}if(flash>0){txt(B,'+'+(wires===4?20:5),140,42,22)}if(!running&&mode){txt(B,'GAME OVER',110,55,22)}document.getElementById('score').textContent='SCORE '+String(score).padStart(3,'0');document.getElementById('life').textContent='MISS '+miss+'/3';document.getElementById('wire').textContent=phase===3?(hookOn?'HOOKを見て JUMP!':'左端で◀を押す'):'WIRE '+wires}function resetPosition(){phase=0;x=28;jump=0;invuln=1.3}function start(m){mode=m;running=true;paused=false;score=0;miss=0;wires=4;level=1;barrels=[];spawn=0;hookOn=false;hookTime=0;resetPosition();document.getElementById('overlay').classList.add('hide');beep(660);render()}function hit(){if(invuln>0)return;miss++;beep(180,.22);if(miss>=3){running=false;document.getElementById('overlay').textContent='GAME OVER\nSCORE '+score+'\nGAME A / B で再挑戦';document.getElementById('overlay').classList.remove('hide')}else resetPosition()}function action(k){if(!running||paused)return;if(k==='jump'){if(jump>0)return;jump=1;beep(720,.04);if(phase===3&&x>=175){if(hookOn&&Math.abs((190-110*Math.abs(Math.sin(hookTime*2.1)))-x)<40){wires--;score+=10;flash=.8;beep(980,.2);hookOn=false;hookTime=0;barrels=[];resetPosition();if(wires===0){score+=20;wires=4;level++;beep(1100,.3)}}else{flash=.35;beep(240,.08)}}return}let dx=k==='left'?-25:k==='right'?25:0;if(dx){if(phase===3&&x<=55&&dx<0){hookOn=true;hookTime=0;beep(510);return}x=Math.max(24,Math.min(332,x+dx));beep(330,.025)}if(k==='up'){if(phase===0&&x>=285){phase=1;x=315;beep(520)}else if(phase===1&&x<=65){phase=2;x=40;beep(520)}else if(phase===2&&x<=65){phase=3;x=42;beep(520)}}if(k==='down'){if(phase===3&&x<=65){phase=2;x=40}else if(phase===2&&x<=65){phase=1;x=40}else if(phase===1&&x>=285){phase=0;x=315}}render()}function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(running&&!paused){invuln=Math.max(0,invuln-dt);jump=Math.max(0,jump-dt*1.1);flash=Math.max(0,flash-dt);if(hookOn){hookTime+=dt;if(hookTime>7)hookOn=false}spawn+=dt;if(spawn>(mode===2?1.5:2.3)/Math.sqrt(level)){spawn=0;barrels.push({p:3,x:320,passed:false})}for(let b of barrels){b.x+=(b.p%2===0?-1:1)*dt*(mode===2?78:57)*Math.sqrt(level);if(b.p===3&&b.x>350){b.p=2;b.x=340}else if(b.p===2&&b.x<8){b.p=1;b.x=20}else if(b.p===1&&b.x>350){b.p=0;b.x=340}if(b.p===phase&&Math.abs(b.x-x)<17){if(jump<.12){hit()}else if(!b.passed){score+=b.p<2?1:2;b.passed=true;beep(840,.035)}}}barrels=barrels.filter(b=>b.p!==0||b.x>0)}render();requestAnimationFrame(tick)}document.getElementById('a').onclick=()=>start(1);document.getElementById('b').onclick=()=>start(2);document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('overlay').textContent='PAUSE';document.getElementById('overlay').classList.toggle('hide',!paused)};document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊 ON':'🔇 OFF'};document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.key)}));window.addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'jump'}[e.key];if(k){e.preventDefault();if(!e.repeat)action(k)}});requestAnimationFrame(tick);
</script></body></html>
